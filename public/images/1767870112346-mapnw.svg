<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Dock-style rounded background (dark sage green) -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"></rect>

  <!-- Clipboard shadow -->
  <rect x="38" y="34" width="52" height="68" rx="10" fill="#000000" opacity="0.14"></rect>

  <!-- Clipboard body -->
  <rect x="36" y="32" width="56" height="72" rx="12" fill="#FFFFFF"></rect>

  <!-- Clipboard clip -->
  <rect x="54" y="24" width="20" height="12" rx="6" fill="#4B5563"></rect>

  <!-- Checklist items -->
  <!-- Done -->
  <rect x="46" y="46" width="6" height="6" rx="2" fill="#22C55E"></rect>
  <line x1="58" y1="49" x2="82" y2="49" stroke="#374151" stroke-width="3" stroke-linecap="round"></line>

  <!-- In progress -->
  <rect x="46" y="58" width="6" height="6" rx="2" fill="#F59E0B"></rect>
  <line x1="58" y1="61" x2="82" y2="61" stroke="#374151" stroke-width="3" stroke-linecap="round"></line>

  <!-- Todo -->
  <rect x="46" y="70" width="6" height="6" rx="2" fill="#EF4444"></rect>
  <line x1="58" y1="73" x2="82" y2="73" stroke="#374151" stroke-width="3" stroke-linecap="round"></line>

  <!-- Project indicator -->
  <circle cx="86" cy="82" r="10" fill="#059669"></circle>
  <circle cx="86" cy="82" r="4" fill="#FFFFFF"></circle>

  <!-- Dark sage green gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B8F71"></stop>
      <stop offset="100%" stop-color="#4D6F5D"></stop>
    </linearGradient>
  </defs>
</svg>
